name: BullSF

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every single hour
  workflow_dispatch: # Keeps your manual "Run workflow" button active

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-bullsf:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Scraper Script
      # This command tells GitHub to look for BullSF.py ANYWHERE in your repository,
      # so even if there's a folder typo, it will find it and run it!
      run: |
        SCRIPT_PATH=$(find . -name "BullSF.py" -print -quit)
        if [ -z "$SCRIPT_PATH" ]; then
          echo "Error: Could not find BullSF.py anywhere in the repo!"
          exit 1
        fi
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        # Track the text files wherever they were created
        git add *.txt || true
        git add **/last_bullsf_patch.txt || true
        git add BullSF.txt || true
        
        if git diff --staged --quiet; then
          echo "No changes found."
        else
          git commit -m "Update: Force update BullSF version string"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
        fi
