name: Steam Dota2

on:
  schedule:
    - cron: '0 * * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual runs

# This block is required to clear Exit Code 128
permissions:
  contents: write

jobs:
  check-patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Patch Checker
      run: python Site/Steam/Dota2/check_patch.py

    - name: Commit and Push changes if updated
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        # Explicitly stage files
        git add Site/Steam/Dota2/last_patch.txt || true
        git add "Steam/Steam Dota 2.txt" || true
        
        # Check if there are changes to commit. If none, exit cleanly instead of failing.
        if git diff --staged --quiet; then
          echo "No new patch data to commit today."
        else
          git commit -m "Update: New Dota 2 Patch Notes"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
        fi
