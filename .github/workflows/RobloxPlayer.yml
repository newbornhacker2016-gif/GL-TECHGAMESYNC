name: Roblox Player

on:
  schedule:
    - cron: '0 */2 * * *' # Automatically runs every 2 hours
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-roblox:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install requests

    - name: Run Scraper Script
      run: |
        SCRIPT_PATH=$(find . -name "Roblox_Player.py" -print -quit)
        if [ -z "$SCRIPT_PATH" ]; then
          echo "Error: Could not locate Roblox_Player.py!"
          exit 1
        fi
        python "$SCRIPT_PATH"

    - name: Commit and Push Updates
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        git add Roblox.txt || true
        git add **/last_roblox_patch.txt || true
        
        if git diff --staged --quiet; then
          echo "No new updates found."
        else
          git commit -m "Update: Extracted Roblox hash"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
        fi
