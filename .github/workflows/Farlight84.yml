name: Farlight 84

on:
  schedule:
    - cron: '30 */6 * * *' # Runs automatically every 6 hours (staggered by 30 mins)
  workflow_dispatch: # Allows manual verification triggers via GitHub UI

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Farlight84 Scraper Script
        run: python Site/Farlight84.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add Farlight84.txt
          
          # Only proceed with commit if structural text updates are found
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Farlight 84 patch date to $(cat Farlight84.txt)"
            git push
          else
            echo "No changes detected. Farlight84.txt remains synchronized with live patch cycles."
          fi
