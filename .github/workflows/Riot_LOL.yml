name: Steam LoL

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 4:00 AM UTC (gives Riot time to publish)
  workflow_dispatch: # Allows manual runs via the website

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-lol-patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run LoL Patch Checker
      run: python Site/Steam/Dota2/check_lol_patch.py

    - name: Commit and Push changes if updated
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        git add Site/Steam/Dota2/last_lol_patch.txt || true
        git add "Steam/League Of Legends.txt" || true
        
        if git diff --staged --quiet; then
          echo "No new League patch data to commit today."
        else
          git commit -m "Update: New League of Legends Patch Notes"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
        fi
