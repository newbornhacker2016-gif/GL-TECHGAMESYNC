name: Check Dota 2 Patch Updates

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual runs

permissions:
  contents: write # Crucial: Gives the workflow permission to commit changes back to your repo

jobs:
  check-patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Patch Checker
      # Points to the exact subfolder where your script lives
      run: python Site/Steam/Dota2/check_patch.py

    - name: Commit and Push changes if updated
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        # Stage the specific target files
        git add "Site/Steam/Dota2/last_patch.txt" "Steam/Steam Dota 2.txt"
        
        # Check if there are changes before committing to avoid workflow errors
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update: New Dota 2 Patch Notes" && git push)
