name: Check Dota 2 Patch Updates

on:
  schedule:
    # This schedule runs the script every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually anytime via the GitHub UI

jobs:
  check-patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python: '3.x'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Patch Checker
      run: python check_patch.py

    - name: Commit and Push changes if updated
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add last_patch.txt latest_patch_notes.txt
        # Only commit if changes actually exist to avoid errors
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update: New Dota 2 Patch Notes Extracted" && git push)
