name: Riot Valo

on:
  schedule:
    - cron: '0 * * * *' # Automated daily run at 5:00 AM UTC
  workflow_dispatch: # Enable manual force triggers via GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-valo:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Scraper Script
      run: python Site/Riot/Riot_Valo.py

    - name: Commit and Push Updates
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        git add Site/Riot/last_valo_patch.txt || true
        git add Valorant.txt || true
        
        if git diff --staged --quiet; then
          echo "No changes found to push."
        else
          git commit -m "Update: New Valorant Patch Notes Extracted"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
        fi
